<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Aesthetic Sage Green Gradient Background */
        body {
            background: linear-gradient(135deg, #e6efea 0%, #c3d8cc 50%, #a3c2b0 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.8rem;
            letter-spacing: 2px;
            color: #0f172a;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            color: #475569;
            font-size: 1.1rem;
        }

        /* Gallery Layout (Centered Cards) */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Glassmorphism Art Card */
        .art-card {
            width: 300px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .art-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15);
        }

        .img-box {
            width: 100%;
            height: 260px;
            overflow: hidden;
            position: relative;
        }

        .art-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .art-card:hover img {
            transform: scale(1.06);
        }

        .art-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .art-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0f172a;
        }

        .art-details {
            font-size: 0.9rem;
            color: #64748b;
        }

        .art-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #15803d;
            margin-top: 5px;
        }

        /* Fullscreen Preview Lightbox Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            padding: 20px;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            object-fit: contain;
            animation: zoomIn 0.3s ease;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 35px;
            color: #f8fafc;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ART GALLERY</h1>
        <p>Explore original paintings and digital artworks</p>
    </div>

    <div class="gallery-container">

        <!-- ARTWORK 1 -->
        <div class="art-card" onclick="openPreview(this)">
            <div class="img-box">
                <img src="chathuiranga.jpg" alt="Abstract Oil Painting">
            </div>
            <div class="art-info">
                <div class="art-title">Abstract Oil Painting</div>
                <div class="art-details">Oil on Canvas | 24 x 36 in</div>
                <div class="art-price">Rs. 75,000</div>
            </div>
        </div>

        <!-- තව Art Cards එකතු කරන්න ඕන නම් පහත කොටසේ Comment අයින් කරලා පාවිච්චි කරන්න -->
        <!-- 
        <div class="art-card" onclick="openPreview(this)">
            <div class="img-box">
                <img src="your-image2.jpg" alt="Artwork Title">
            </div>
            <div class="art-info">
                <div class="art-title">Artwork Title</div>
                <div class="art-details">Medium | Size</div>
                <div class="art-price">Rs. 50,000</div>
            </div>
        </div>
        -->

    </div>

    <!-- Fullscreen Image Preview Popup -->
    <div id="imageModal" class="modal" onclick="closePreview()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <script>
        function openPreview(card) {
            const imgSrc = card.querySelector('img').src;
            const modal = document.getElementById('imageModal');
            const fullImg = document.getElementById('fullImage');
            
            fullImg.src = imgSrc;
            modal.style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>

</body>
</html>
